name: Test Windows list control

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  selection-mark:
    runs-on: windows-2022
    strategy:
      matrix:
        controls: [5, 6]
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build standalone Win32 test
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw "Visual C++ tools not found" }
          $setup = Join-Path $installation 'Common7\Tools\VsDevCmd.bat'
          cmd /c "`"$setup`" -arch=x86 -host_arch=x64 && cl /nologo /W4 /WX /EHsc /DCOMMON_CONTROLS_VERSION=${{ matrix.controls }} tests\listview_selection_mark.cpp /Fe:listview_selection_mark.exe /link comctl32.lib user32.lib /MANIFEST:EMBED"
          if ($LASTEXITCODE -ne 0) { throw "Control test compilation failed" }
      - name: Test selection mark, focus, and selection after sorting
        shell: pwsh
        run: |
          & .\listview_selection_mark.exe
          if ($LASTEXITCODE -ne 0) { throw "Control test failed" }
